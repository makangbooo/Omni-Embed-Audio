name: oea-repro
channels:
  - conda-forge
dependencies:
  # [CODE] The official requirements were generated from `.venv-oea311`.
  - python=3.11
  - pip
  # Runtime tools used by the audio processors. Exact builds are captured after
  # the first successful Linux solve rather than guessed on Windows.
  - ffmpeg
  - libsndfile
  # [INFERRED] Reproduction tooling required to extract the official Clotho .7z archive.
  - 7zip=26.02
  - git
