# UIQ Generation Configuration
# Usage: python -m AudioRetrieval generate-uiq ...

defaults:
  - _self_

# Backend selection
backend: gpt  # gpt, llama

# Dataset settings
dataset: clotho  # clotho, audiocaps
captions_csv: ???
output_dir: ???

# Query types to generate
query_types:
  - question
  - imperative
  - paraphrase
  - tagging
  # - negative  # Requires hard_neg_jsonl

# Hard negatives for negative query generation
hard_neg_jsonl: null

# Generation settings
batch_size: 10
max_tokens: 100
temperature: 0.7

# GPT-specific settings
gpt:
  model: gpt-4
  api_key: null  # Uses OPENAI_API_KEY env var if not set

# LLaMA-specific settings
llama:
  model_name: meta-llama/Llama-2-7b-chat-hf
  torch_dtype: float16
  device: cuda
