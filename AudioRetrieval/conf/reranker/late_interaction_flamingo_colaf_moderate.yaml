# @package _global_

# ColAF Late-Interaction Reranker - MODERATE
# Balanced speed/accuracy trade-off
#
# Optimizations enabled:
# - Token pooling: 2× reduction
# - Audio striding: 2× reduction
# - Query pruning: 80% kept
#
# Expected speedup: ~8-10× over baseline
# Expected accuracy loss: ~3%

reranker:
  enabled: true
  name: late_interaction_flamingo_colaf_moderate
  mode: late_interaction
  top_k: 50

  client:
    name: late_interaction
    params:
      embedding_root: results/late_interaction_flamingo
      dataset: clotho_evaluation
      model: audio-flamingo-3
      audio_subdir: audio
      caption_subdir: captions
      aggregation: mean
      blend_with_initial: 1.0
      filter_prefix_tokens: true

      # Projection settings
      projection_checkpoint: outputs/colaf_heads/clotho_colaf_ft/best.pt
      projection_device: cpu

      # Token prefix/max settings
      audio_prefix_tokens: 0
      text_prefix_tokens: 0
      audio_max_tokens: null
      text_max_tokens: null

      # Token optimization parameters (Moderate)
      token_pool_factor: 2           # Pool 2 consecutive tokens → 50% reduction
      audio_token_stride: 2          # Stride audio by 2 → 50% reduction
      text_token_stride: 1           # No text striding
      query_token_keep_ratio: 0.8    # Keep top 80% query tokens
      query_pruning_method: norm     # Use L2 norm for importance
